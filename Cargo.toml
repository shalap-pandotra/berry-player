[workspace]
members = ["crates/berry-core", "crates/berry-tui"]
resolver = "2"

# shared by both crates: bump the version here and both follow
[workspace.package]
version = "0.2.2"
edition = "2021"

# profiles only count in the workspace file, so the release settings live here
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
