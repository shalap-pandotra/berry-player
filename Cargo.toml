[package]
name = "berry"
version = "0.1.1"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
lofty = "0.22"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
color_quant = "1.1"
gag = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
